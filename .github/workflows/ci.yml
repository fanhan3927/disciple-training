name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      ENABLE_AI: "false"
      ENABLE_GROUP_POSTS: "false"
      ENABLE_PRAYERS: "false"
      ENABLE_EMAIL_NOTIFICATIONS: "false"
      ENABLE_DATA_EXPORT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck -- --incremental false
      - name: Lint
        run: npm run lint -- --no-cache
      - name: Unit tests
        run: npm test -- --no-cache --no-file-parallelism --maxWorkers=1
      - name: Production build
        run: npm run build
